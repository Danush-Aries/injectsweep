[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "injectsweep"
version = "0.1.0"
description = "Static pre-ingestion linter that catches prompt-injection payloads hidden in RAG documents (OWASP LLM01)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dhanush Shankar", email = "danushankar3@gmail.com" }]
keywords = ["ai-security", "prompt-injection", "rag", "owasp", "llm-security", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pypdf>=4.0",
    "beautifulsoup4>=4.11",
    "python-docx>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# Tests need pytest + jsonschema + fpdf2 (used to generate corpus fixtures).
#   pip install -e ".[dev]"
dev = [
    "pytest>=7.0",
    "jsonschema>=4.0",
    "fpdf2>=2.7",
]

[project.urls]
Homepage = "https://github.com/Danush-Aries/injectsweep"
Repository = "https://github.com/Danush-Aries/injectsweep"
Issues = "https://github.com/Danush-Aries/injectsweep/issues"

[project.scripts]
injectsweep = "injectsweep.cli:main"

[tool.setuptools.packages.find]
include = ["injectsweep*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
